backend:
  name: github
  repo: ruhtusri/Overbrewed-
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Matcha Logs", "Random Thoughts", "Long Distance", "Work Life", "Reading", "Moving Back"]
      - { label: "Short description (shows on homepage)", name: "description", widget: "text" }
      - { label: "Emoji (used if no cover image)", name: "emoji", widget: "string", required: false, default: "🍵" }
      - { label: "Cover image (optional)", name: "cover", widget: "image", required: false }
      - { label: "Post content", name: "body", widget: "markdown" }
